[package]
name = "personal-ci"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ci"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
glob = "0.3.4"
hex = "0.4.3"
js-semver = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = { version = "1.1.8", features = ["preserve_order"] }
walkdir = "2.5.0"

[build-dependencies]
hex = "0.4.3"
sha2 = "0.11.1"
