# Stable options. Cargo supplies the project's parser edition.
# Pin the formatting style so dependency/edition upgrades do not select it.
style_edition = "2024"
max_width = 100
# Keep longer calls and method chains multiline independently of the line width.
fn_call_width = 60
chain_width = 60
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true
use_try_shorthand = true
