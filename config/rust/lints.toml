# Read by the shared Rust check command. Groups precede individual lints.

[rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "warn"
unreachable_pub = "warn"

[clippy]
all = "warn"

# Readable control flow. Thresholds are starting points, not design targets.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
fn_params_excessive_bools = "warn"

# Handle failures; keep panics out of ordinary runtime paths.
unwrap_used = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Keep unfinished code and unexplained unsafe operations visible.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

# Ban selected APIs through clippy.toml when a project has an actual policy.
disallowed_methods = "warn"
disallowed_types = "warn"
disallowed_macros = "warn"

# Ownership: fix borrow design instead of cloning around it. clone_on_ref_ptr
# forces Arc::clone(&x), so a remaining .clone() always marks a deep copy.
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
needless_pass_by_value = "warn"
clone_on_ref_ptr = "warn"
rc_mutex = "warn"

# Small, explicit Rust-specific improvements.
wildcard_imports = "warn"
unused_async = "warn"
