[project]
name = "personal-ci"
version = "0.1.0"
description = "Reusable CI workflows and actions"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["ruff>=0.13", "yamllint>=1.37,<2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
