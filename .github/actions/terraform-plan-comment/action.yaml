name: Terraform Plan PR Comment
description: Post a Terraform plan output as a PR comment
inputs:
  working-directory:
    description: Directory containing the plan.txt output
    required: true
  env-name:
    description: Environment name for the comment heading
    required: true
runs:
  using: composite
  steps:
    - name: Update plan comment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKING_DIR: ${{ inputs.working-directory }}
        ENV_NAME: ${{ inputs.env-name }}
      run: bash "$GITHUB_ACTION_PATH/../run.sh" terraform-plan-comment
