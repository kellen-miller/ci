name: Code duplication
description: Run the official JSCPD action with shared defaults and enforced failure status
inputs:
  working-directory:
    description: Directory containing the scan configuration
    default: .
  config:
    description: Optional config path; otherwise use local .jscpd.json or the shared defaults
    default: ''
  version:
    description: JSCPD release version downloaded by the official action
    default: '5.4.0'
  threshold:
    description: Optional threshold override; empty preserves configuration
    default: ''
  reporters:
    description: Optional reporters override; empty preserves configuration
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '26'
        package-manager-cache: false
    - name: Resolve duplication configuration
      id: config
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CPD_CONFIG: ${{ inputs.config }}
        CPD_REPORTERS: ${{ inputs.reporters }}
      run: node "$GITHUB_ACTION_PATH/config.mjs"
    - name: Check duplication
      id: scan
      uses: kucherenko/jscpd@b6f832c62cf02b574ea9cf24e013cfeb17366a35 # v5.4.0
      with:
        version: ${{ inputs.version }}
        path: ''
        config: ${{ steps.config.outputs.config }}
        install-prefix: ${{ steps.config.outputs.install-prefix }}
        reporters: ${{ steps.config.outputs.reporters }}
        output: ${{ steps.config.outputs.output }}
        threshold: ${{ inputs.threshold }}
        extra-args: --no-tips --no-colors
        upload-sarif: 'false'
    - name: Enforce duplication result
      shell: bash
      env:
        CPD_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "$CPD_EXIT_CODE"
