name: Code duplication
description: Run Rust cpd with shared defaults or a repository configuration
inputs:
  working-directory:
    description: Directory containing the scan configuration
    default: .
  config:
    description: Optional config path; otherwise use local .jscpd.json or the shared defaults
    default: ''
  version:
    description: Rust jscpd crate version
    default: '5.4.0'
  threshold:
    description: Optional threshold override; empty preserves configuration
    default: ''
  reporters:
    description: Optional reporters override; empty preserves configuration
    default: ''
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        rustflags: ''
    - name: Install cpd
      shell: bash
      env:
        CPD_VERSION: ${{ inputs.version }}
      run: cargo install jscpd --version "$CPD_VERSION" --locked
    - name: Check duplication
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CPD_CONFIG: ${{ inputs.config }}
        CPD_THRESHOLD: ${{ inputs.threshold }}
        CPD_REPORTERS: ${{ inputs.reporters }}
      run: bash "$GITHUB_ACTION_PATH/../run.sh" code-duplication
