name: Set Up Playwright
description: Install Playwright browsers with caching by version, browser set, and operating-system distribution.
inputs:
  working-directory:
    description: Working directory where Playwright is installed as a dependency.
    required: false
    default: .
  browsers:
    description: Browsers to install (space-separated, e.g. 'chromium firefox webkit'). Empty installs all.
    required: false
    default: ''
  version:
    description: Playwright version override. Empty sniffs ./node_modules/.bin/playwright after install.
    required: false
    default: ''
outputs:
  cache-hit:
    description: Whether browsers were restored from cache.
    value: ${{ steps.cache.outputs.cache-hit }}
  version:
    description: Resolved Playwright version.
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
        RUNNER_OS: ${{ runner.os }}
        PLAYWRIGHT_VERSION: ${{ inputs.version }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        bash "$GITHUB_ACTION_PATH/../run.sh" playwright-version
        if [[ "$RUNNER_OS" == Linux ]]; then
          . /etc/os-release
          cache_image="${ID:?}-${VERSION_ID:?}"
        else
          cache_image="${ImageOS:-$RUNNER_OS}"
        fi
        printf 'cache-image=%s\n' "$cache_image" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.resolve.outputs.cache-path }}
        key: ${{ steps.resolve.outputs.cache-key }}-${{ steps.resolve.outputs.cache-image }}
    - name: Install browsers (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: bash "$GITHUB_ACTION_PATH/../run.sh" playwright-install
    - name: Install system deps (cache hit)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: bash "$GITHUB_ACTION_PATH/../run.sh" playwright-deps
