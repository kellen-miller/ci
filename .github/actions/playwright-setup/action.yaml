name: Set Up Playwright
description: Install Playwright browsers with caching keyed on the installed Playwright version and browser set.
inputs:
  working-directory:
    description: Working directory where Playwright is installed as a dependency.
    required: false
    default: .
  browsers:
    description: Browsers to install (space-separated, e.g. 'chromium firefox webkit'). Empty installs all.
    required: false
    default: ''
  version:
    description: Playwright version override. Empty sniffs ./node_modules/.bin/playwright after install.
    required: false
    default: ''
outputs:
  cache-hit:
    description: Whether browsers were restored from cache.
    value: ${{ steps.cache.outputs.cache-hit }}
  version:
    description: Resolved Playwright version.
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
        RUNNER_OS: ${{ runner.os }}
        PLAYWRIGHT_VERSION: ${{ inputs.version }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/resolve-version.sh"
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.resolve.outputs.cache-key }}
    - name: Install browsers (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browsers <<< "$BROWSERS"
        ./node_modules/.bin/playwright install --with-deps ${browsers[@]+"${browsers[@]}"}
    - name: Install system deps (cache hit)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browsers <<< "$BROWSERS"
        ./node_modules/.bin/playwright install-deps ${browsers[@]+"${browsers[@]}"}
