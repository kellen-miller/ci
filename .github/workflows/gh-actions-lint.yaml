name: GitHub Actions lint
on:
  workflow_call:
    inputs:
      allow-pull-request-target:
        description: Explicitly allow an independently reviewed privileged PR trigger.
        type: boolean
        default: false
      allow-secret-inheritance:
        description: Explicitly allow independently reviewed secret inheritance.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - uses: kellen-miller/ci/.github/actions/validate-workflow-security@c2fec0ce6c6f3c829686850dbffb9a670fc3f0be
        with:
          allow-pull-request-target: ${{ inputs.allow-pull-request-target }}
          allow-secret-inheritance: ${{ inputs.allow-secret-inheritance }}
