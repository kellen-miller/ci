name: Rust Test
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing Cargo.toml and Cargo.lock
        type: string
        default: .
      runner:
        description: Runner label; callers can supply their operating-system matrix
        type: string
        default: ubuntu-latest
      toolchain:
        description: Empty honors the caller's toolchain file in working-directory, otherwise stable
        type: string
        default: ''
      build:
        description: Build all workspace targets after tests
        type: boolean
        default: false
      build-release:
        description: Use the release profile for the optional build
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    name: Rust Test
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Rust workspace
        uses: kellen-miller/ci/.github/actions/rust-check@231cafbffe18e706ce5b786b67b25069886b0f01
        with:
          working-directory: ${{ inputs.working-directory }}
          toolchain: ${{ inputs.toolchain }}
          checks: ${{ inputs.build && 'test build' || 'test' }}
          build-profile: ${{ inputs.build-release && 'release' || 'dev' }}
