name: Gradle Check
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for validation.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory containing the Gradle wrapper.
        type: string
        default: .
      java-version:
        description: Java version used for validation.
        type: string
        default: '21'
      distribution:
        description: Java distribution supported by setup-java.
        type: string
        default: temurin
      arguments:
        description: Whitespace-separated wrapper arguments; shell syntax is not evaluated.
        type: string
        default: check
permissions:
  contents: read
jobs:
  check:
    name: Gradle Check
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
      - name: Run Gradle validation
        env:
          GRADLE_ARGUMENTS: ${{ inputs.arguments }}
        uses: kellen-miller/ci/.github/actions/run@f409e67bb73d3ea10c7c3853984e8701f43fc3d7
        with:
          operation: gradle-check
          working-directory: ${{ inputs.working-directory }}
