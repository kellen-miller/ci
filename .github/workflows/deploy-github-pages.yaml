name: Deploy GitHub Pages
'on':
  workflow_call:
    inputs:
      working-directory:
        description: Working directory containing package.json and the lockfile.
        type: string
        default: .
      package-manager:
        description: Package manager to use (pnpm|npm|yarn|bun). Auto-detected from the lockfile when empty.
        type: string
        default: ''
      node-version:
        description: Node.js version. Empty selects from .nvmrc, package.json engines, or setup-node's default.
        type: string
        default: ''
      pnpm-version:
        description: pnpm version. Empty lets pnpm/action-setup read the packageManager field in package.json.
        type: string
        default: ''
      bun-version:
        description: bun version. Empty installs the latest.
        type: string
        default: ''
      install-args:
        description: Extra arguments appended to the install command.
        type: string
        default: ''
      build-script:
        description: Script name to run (invoked as '<pm> run <script>').
        type: string
        default: build
      build-env:
        description: Environment variables for the build step as KEY=VALUE lines.
        type: string
        default: ''
      output-directory:
        description: Path to the built output, relative to working-directory.
        type: string
        default: build
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: setup
        uses: kellen-miller/ci/.github/actions/setup-node@6a0d4f6718ed6cea356a99b7b7460244a42243bd
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          bun-version: ${{ inputs.bun-version }}
          install-args: ${{ inputs.install-args }}
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.setup.outputs.package-manager }}
          SCRIPT: ${{ inputs.build-script }}
          BASE_PATH: /${{ github.event.repository.name }}
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "Invalid build environment assignment" >&2
              exit 1
            fi

            export "${line?}"
          done <<< "$BUILD_ENV"
          "$PM" run "$SCRIPT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}
  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
