name: Deploy GitHub Pages
'on':
  workflow_call:
    inputs:
      working-directory:
        description: Working directory containing package.json and the lockfile.
        type: string
        default: .
      package-manager:
        description: Package manager to use (pnpm|npm|yarn|bun). Auto-detected from the lockfile when empty.
        type: string
        default: ''
      node-version:
        description: Node.js version. Empty selects from .nvmrc, package.json engines, or setup-node's default.
        type: string
        default: ''
      pnpm-version:
        description: pnpm version. Empty lets pnpm/action-setup read the packageManager field in package.json.
        type: string
        default: ''
      bun-version:
        description: bun version. Empty installs the latest.
        type: string
        default: ''
      install-args:
        description: Extra arguments appended to the install command.
        type: string
        default: ''
      build-script:
        description: Script name to run (invoked as '<pm> run <script>').
        type: string
        default: build
      build-env:
        description: Environment variables for the build step as KEY=VALUE lines.
        type: string
        default: ''
      output-directory:
        description: Path to the built output, relative to working-directory.
        type: string
        default: build
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: setup
        uses: kellen-miller/ci/.github/actions/setup-node@f409e67bb73d3ea10c7c3853984e8701f43fc3d7
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          bun-version: ${{ inputs.bun-version }}
          install-args: ${{ inputs.install-args }}
      - name: Build
        env:
          PM: ${{ steps.setup.outputs.package-manager }}
          SCRIPT: ${{ inputs.build-script }}
          BASE_PATH: /${{ github.event.repository.name }}
          BUILD_ENV: ${{ inputs.build-env }}
        uses: kellen-miller/ci/.github/actions/run@f409e67bb73d3ea10c7c3853984e8701f43fc3d7
        with:
          operation: pages-build
          working-directory: ${{ inputs.working-directory }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}
  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
