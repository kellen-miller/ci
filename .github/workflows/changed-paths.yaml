name: Changed paths
on:
  workflow_call:
    inputs:
      filters:
        description: JSON object mapping CI group names to positive glob patterns.
        required: true
        type: string
    outputs:
      changes:
        description: JSON object mapping CI group names to booleans.
        value: ${{ jobs.detect.outputs.changes }}
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@097cf6c50e53d046768c2479a673ab96e3127744
        with:
          filters: ${{ inputs.filters }}
