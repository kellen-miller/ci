name: Releases
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  semantic-release-integration:
    name: Semantic-release integration tests
    runs-on: ubuntu-latest
    env:
      CI_BINARY: ${{ github.workspace }}/target/debug/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Build current CI implementation
        run: cargo build --locked
      - name: Install semantic-release dependencies
        run: npm ci --prefix .github/actions/release/semantic-release --ignore-scripts --no-audit --no-fund
      - name: Run semantic-release integration tests
        run: cargo test --locked --test release -- --ignored
