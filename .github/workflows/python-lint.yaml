name: Python Lint
on:
  workflow_call:
    inputs:
      src:
        description: source directory to run format and lint
        type: string
        default: .
permissions:
  contents: read
jobs:
  format:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          src: ${{ inputs.src }}
          args: format --check --diff
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          src: ${{ inputs.src }}
