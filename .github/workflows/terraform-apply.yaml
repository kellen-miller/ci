name: Terraform Apply
'on':
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform root module
        required: true
        type: string
      env-name:
        description: Logical environment name used in the job label
        required: false
        type: string
        default: default
      project-id:
        description: GCP project ID (passed to google-github-actions/auth)
        required: true
        type: string
      terraform-version:
        description: Terraform version. Set to a specific version (e.g. 1.9.8) to pin; defaults to the latest stable
          release.
        required: false
        type: string
        default: latest
      environment:
        description: Optional GitHub environment that gates infrastructure access
        type: string
        default: ''
    secrets:
      WORKLOAD_IDENTITY_PROVIDER:
        required: true
      WIF_SERVICE_ACCOUNT:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  apply:
    name: Terraform Apply (${{ inputs.env-name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.project-id }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Terraform init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init
      - name: Terraform plan
        working-directory: ${{ inputs.working-directory }}
        run: terraform plan -no-color -out=tfplan
      - name: Terraform apply
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -auto-approve tfplan
    environment: ${{ inputs.environment }}
