name: Terraform Lint
on:
  workflow_call:
    inputs:
      working-directory:
        description: Root directory containing Terraform code
        required: false
        type: string
        default: terraform
      terraform-version:
        description: Terraform version
        required: false
        type: string
        default: latest
      tflint-version:
        description: TFLint version
        required: false
        type: string
        default: v0.64.0
      trivy:
        description: Run Trivy config scan
        required: false
        type: boolean
        default: true
      trivy-version:
        description: Trivy version
        required: false
        type: string
        default: v0.75.0
      trivy-severity:
        description: Trivy severity threshold
        required: false
        type: string
        default: HIGH,CRITICAL
permissions:
  contents: read
jobs:
  lint:
    name: Terraform Fmt + TFLint${{ inputs.trivy && ' + Trivy' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Terraform fmt check
        run: terraform fmt -check -recursive "$TF_DIRECTORY"
        env:
          TF_DIRECTORY: ${{ inputs.working-directory }}
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: ${{ inputs.tflint-version }}
      - name: Init TFLint plugins
        working-directory: ${{ inputs.working-directory }}
        run: tflint --init
      - name: Run TFLint
        working-directory: ${{ inputs.working-directory }}
        run: tflint --recursive
      - name: Run Trivy config scan
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          version: ${{ inputs.trivy-version }}
          cache: 'true'
