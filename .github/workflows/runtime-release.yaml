name: Release Rust runtime
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-release
  cancel-in-progress: false
jobs:
  version:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CI_BINARY: ${{ github.workspace }}/target/debug/ci
    outputs:
      version: ${{ steps.ready.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          rustflags: ''
      - run: cargo build --locked
      - id: release
        uses: ./.github/actions/release
        with:
          token: ${{ github.token }}
          first-release-version: '0.1.0'
          dry-run: 'true'
      - name: Propose synchronized runtime metadata
        id: ready
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo run --locked -- prepare-runtime-version "$VERSION"
          if git diff --quiet -- Cargo.toml Cargo.lock runtime-version; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            branch="release/v$VERSION"
            existing="$(gh pr list --head "$branch" --base main --json url --jq '.[0].url // empty')"
            if [[ -n "$existing" ]]; then
              echo "Waiting for metadata PR: $existing"
            else
              git switch -c "$branch"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add Cargo.toml Cargo.lock runtime-version
              git commit -m "chore(release): $VERSION"
              gh auth setup-git
              git push origin "HEAD:refs/heads/$branch"
              gh pr create --base main --head "$branch" --title "chore(release): $VERSION" --body 'Synchronize Cargo and loader versions for the next semantic release. Merge after CI passes; the main workflow then qualifies and publishes the runtime.'
              gh workflow run ci.yaml --ref "$branch"
            fi
          fi
  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          rustflags: ''
      - name: Install Linux static-link tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo run --locked -- package "$TARGET" "target/$TARGET/release/ci${{ runner.os == 'Windows' && '.exe' || '' }}" dist
      - name: Qualify packaged runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo run --locked -- verify-runtime "$TARGET" dist
      - name: Verify loader and script contracts
        shell: bash
        run: cargo test --locked --test process_scripts --test runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CI_BINARY: ${{ github.workspace }}/target/debug/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          rustflags: ''
      - run: cargo build --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist
      - id: release
        uses: ./.github/actions/release
        with:
          token: ${{ github.token }}
          first-release-version: '0.1.0'
      - name: Publish qualified archives
        if: steps.release.outputs.release_published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$EXPECTED_VERSION"
          gh release upload "$RELEASE_TAG" dist/*
