name: PR Lint
on:
  workflow_call:
    inputs:
      runner-label:
        description: Runner label for the lint job
        required: false
        type: string
        default: ubuntu-latest
      types:
        description: Allowed types (newline-delimited regex patterns)
        required: false
        type: string
        default: ''
      scopes:
        description: Allowed scopes (newline-delimited regex patterns)
        required: false
        type: string
        default: ''
      require-scope:
        description: Require a scope in the PR title
        required: false
        type: boolean
        default: false
      disallow-scopes:
        description: Disallowed scopes (newline-delimited regex patterns)
        required: false
        type: string
        default: ''
      subject-pattern:
        description: Regex to validate the subject
        required: false
        type: string
        default: ''
      subject-pattern-error:
        description: Custom error message for subjectPattern
        required: false
        type: string
        default: ''
      github-base-url:
        description: Override the GitHub base URL
        required: false
        type: string
        default: ''
      ignore-labels:
        description: Labels that skip validation (newline-delimited)
        required: false
        type: string
        default: ''
      header-pattern:
        description: Regex to parse type/scope/subject
        required: false
        type: string
        default: ''
      header-pattern-correspondence:
        description: CSV mapping for headerPattern capture groups
        required: false
        type: string
        default: ''
      validate-single-commit:
        description: Validate title against a single commit
        required: false
        type: boolean
        default: false
      validate-single-commit-matches-pr-title:
        description: Ensure single commit matches PR title
        required: false
        type: boolean
        default: false
jobs:
  pr-lint:
    name: PR Lint
    runs-on: ${{ inputs.runner-label }}
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          disallowScopes: ${{ inputs.disallow-scopes }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
          githubBaseUrl: ${{ inputs.github-base-url }}
          ignoreLabels: ${{ inputs.ignore-labels }}
          headerPattern: ${{ inputs.header-pattern }}
          headerPatternCorrespondence: ${{ inputs.header-pattern-correspondence }}
          validateSingleCommit: ${{ inputs.validate-single-commit }}
          validateSingleCommitMatchesPrTitle: ${{ inputs.validate-single-commit-matches-pr-title }}
permissions:
  contents: read
  pull-requests: read
