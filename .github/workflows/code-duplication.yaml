name: Code duplication
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the scan configuration
        type: string
        default: .
      config:
        description: Configuration path relative to working-directory
        type: string
        default: .jscpd.json
      version:
        description: Rust jscpd crate version
        type: string
        default: 5.4.0
      threshold:
        description: Optional threshold override; empty preserves configuration
        type: string
        default: ''
      reporters:
        description: Optional reporters override; empty preserves configuration
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@0bdade77edfa48cf4fd486946b7c750de5fb0358
        with:
          working-directory: ${{ inputs.working-directory }}
          config: ${{ inputs.config }}
          version: ${{ inputs.version }}
          threshold: ${{ inputs.threshold }}
          reporters: ${{ inputs.reporters }}
