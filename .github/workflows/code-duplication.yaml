name: Code duplication
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  jscpd-scan:
    name: Code duplication / JSCPD scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan repository for duplicated code
        uses: ./.github/actions/code-duplication
  configuration-tests:
    name: Code duplication / Configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Test duplication configuration
        run: node --test .github/actions/code-duplication/config.test.mjs
