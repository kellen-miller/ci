name: Go Test
'on':
  workflow_call:
    inputs:
      go-version:
        description: Go version to use
        required: false
        default: stable
        type: string
      race:
        description: Run tests with "-race" flag
        required: false
        default: true
        type: boolean
      integration:
        description: Run integration tests
        required: false
        default: ''
        type: string
      working-directory:
        description: Using the working-directory keyword, you can specify the working directory of where to run
          the command.
        type: string
        default: .
jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Run Go unit tests
        env:
          INTEGRATION: ${{ inputs.integration }}
          RACE: ${{ inputs.race }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          args=(-v)
          if [[ "$RACE" == true ]]; then
            args+=(-race)
          fi

          go test "${args[@]}" ./...
permissions:
  contents: read
