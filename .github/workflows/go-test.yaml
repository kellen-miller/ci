name: Go tests
'on':
  workflow_call:
    inputs:
      check-name:
        description: Specific suite or operation name shown beneath the caller domain.
        type: string
        default: ''
      runner:
        description: Runner label; callers can supply their operating-system matrix.
        type: string
        default: ubuntu-latest
      go-version-file:
        description: Optional go.mod or go.work path; takes precedence over go-version.
        type: string
        default: ''
      go-version:
        description: Go version to use
        required: false
        default: stable
        type: string
      race:
        description: Run tests with "-race" flag
        required: false
        default: true
        type: boolean
      test-packages:
        description: Whitespace-separated package paths to test.
        type: string
        default: ./...
      vet:
        description: Run go vet after tests.
        type: boolean
        default: false
      build-target:
        description: Optional package path to build after tests and vet.
        type: string
        default: ''
      integration:
        description: Run integration tests
        required: false
        default: ''
        type: string
      working-directory:
        description: Using the working-directory keyword, you can specify the working directory of where to run
          the command.
        type: string
        default: .
jobs:
  package-tests:
    name: ${{ inputs.check-name || format('Package tests{0}', inputs.race && ' with race detection' || '') }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ inputs.go-version-file == '' && inputs.go-version || '' }}
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Run package tests and optional vet/build
        env:
          INTEGRATION: ${{ inputs.integration }}
          RACE: ${{ inputs.race }}
          TEST_PACKAGES: ${{ inputs.test-packages }}
          VET: ${{ inputs.vet }}
          BUILD_TARGET: ${{ inputs.build-target }}
        uses: kellen-miller/ci/.github/actions/run@349cce1044cfe84a8ad80cce226d760b6a9d3485
        with:
          operation: go-test
          working-directory: ${{ inputs.working-directory }}
permissions:
  contents: read
