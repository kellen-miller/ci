name: Go lint
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing go.mod
        type: string
        default: .
      go-version:
        description: Go version or supported setup-go constraint
        type: string
        default: stable
      golangci-lint-version:
        description: golangci-lint version
        type: string
        default: v2.14.0
      config:
        description: Optional config path relative to working-directory; empty uses normal discovery
        type: string
        default: ''
      vulnerability-check:
        description: Run govulncheck
        type: boolean
        default: true
      govulncheck-version:
        description: golang.org/x/vuln module version
        type: string
        default: v1.1.4
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@0bdade77edfa48cf4fd486946b7c750de5fb0358
        with:
          working-directory: ${{ inputs.working-directory }}
          go-version: ${{ inputs.go-version }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
          config: ${{ inputs.config }}
          vulnerability-check: ${{ inputs.vulnerability-check }}
          govulncheck-version: ${{ inputs.govulncheck-version }}
