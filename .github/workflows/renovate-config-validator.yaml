name: Renovate Config Validator
on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the Renovate config file to validate.
        type: string
        default: renovate.json
      global-config:
        description: Validate as Renovate global config. Set false to validate as repository config.
        type: boolean
        default: false
      node-version:
        description: Node.js version used to run Renovate.
        type: string
        default: '24'
      renovate-version:
        description: Renovate package version used for validation.
        type: string
        default: 44.145.3
permissions:
  contents: read
jobs:
  validate:
    name: Renovate Config Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Renovate inputs for changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo 'validate=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only --no-renames -z "${BASE_SHA}...${HEAD_SHA}" -- \
            ":(literal)${CONFIG_FILE}" ":(literal)default.json" \
            '.github/workflows/' > "${RUNNER_TEMP}/renovate-changes"

          if [[ -s "${RUNNER_TEMP}/renovate-changes" ]]; then
            echo 'validate=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'validate=false' >> "${GITHUB_OUTPUT}"
            echo 'Renovate config unchanged; skipping validation.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.changes.outputs.validate == 'true'
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate Renovate config
        if: steps.changes.outputs.validate == 'true'
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          GLOBAL_CONFIG: ${{ inputs.global-config }}
          RENOVATE_VERSION: ${{ inputs.renovate-version }}
        run: |
          set -euo pipefail

          args=()
          if [[ "${GLOBAL_CONFIG}" != "true" ]]; then
            args+=(--no-global)
          fi

          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator "${args[@]}" "${CONFIG_FILE}"
