name: Rust
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  formatting:
    name: Rust / Formatting validation
    runs-on: ubuntu-latest
    env:
      CI_ROOT: ${{ github.workspace }}
      WORKING_DIRECTORY: ${{ github.workspace }}
      SETUP_TOOLCHAIN: 'false'
      POLICY_DIRECTORY: ''
      ALL_FEATURES: 'true'
      BUILD_PROFILE: dev
      CHECKS: fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ''
      - name: Formatting validation
        run: cargo run --locked -- rust-check
  clippy:
    name: Rust / Clippy
    runs-on: ubuntu-latest
    env:
      CI_ROOT: ${{ github.workspace }}
      WORKING_DIRECTORY: ${{ github.workspace }}
      SETUP_TOOLCHAIN: 'false'
      POLICY_DIRECTORY: ''
      ALL_FEATURES: 'true'
      BUILD_PROFILE: dev
      CHECKS: clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ''
      - name: Clippy
        run: cargo run --locked -- rust-check
  runtime-regressions:
    name: Rust / Runtime regression suite
    runs-on: ubuntu-latest
    env:
      CI_ROOT: ${{ github.workspace }}
      WORKING_DIRECTORY: ${{ github.workspace }}
      SETUP_TOOLCHAIN: 'false'
      POLICY_DIRECTORY: ''
      ALL_FEATURES: 'true'
      BUILD_PROFILE: dev
      CHECKS: test
      CI_BINARY: ${{ github.workspace }}/target/debug/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.1
      - name: Install golangci-lint for formatter integration tests
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Build current CI implementation
        run: cargo build --locked
      - name: Runtime regression suite
        run: cargo run --locked -- rust-check
