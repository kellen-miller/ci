name: Cosign Attest
'on':
  workflow_call:
    inputs:
      image:
        description: Full image reference to attest (prefer a digest pin, e.g. registry/repo@sha256:...)
        required: true
        type: string
      cosign-version:
        description: Cosign release version
        required: false
        type: string
        default: v3.1.3
      verify:
        description: Verify the attestation after publishing (sanity check)
        required: false
        type: boolean
        default: true
      verify-identity:
        description: Exact signing certificate identity (reusable workflow URL plus @ref)
        type: string
        required: true
      registry:
        description: Registry hostname for signature storage
        type: string
        default: ghcr.io
      registry-username:
        description: Registry username; empty uses github.actor
        type: string
        default: ''
    secrets:
      REGISTRY_PASSWORD:
        description: Registry password; empty uses GITHUB_TOKEN for GHCR
        required: false
permissions:
  contents: read
  id-token: write
  packages: write
jobs:
  attest:
    name: Cosign Attest
    runs-on: ubuntu-latest
    steps:
      - name: Log in to signature registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ inputs.cosign-version }}
      - name: Write SLSA provenance predicate
        env:
          BUILD_TYPE: https://actions.github.io/buildtypes/workflow/v1
          IMAGE: ${{ inputs.image }}
          INVOCATION_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{
            github.run_attempt }}
          REPOSITORY: https://github.com/${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const env = process.env;
          const predicate = {
            buildDefinition: {
              buildType: env.BUILD_TYPE,
              externalParameters: {
                repository: env.REPOSITORY,
                ref: env.REF,
                workflowRef: env.WORKFLOW_REF,
              },
              internalParameters: {},
              resolvedDependencies: [
                {
                  uri: `git+${env.REPOSITORY}@${env.REF}`,
                  digest: { gitCommit: env.SHA },
                },
                {
                  uri: env.WORKFLOW_REF,
                  digest: { gitCommit: env.WORKFLOW_SHA || env.SHA },
                },
              ],
            },
            runDetails: {
              builder: {
                id: "https://github.com/actions/runner",
              },
              metadata: {
                invocationId: env.INVOCATION_ID,
              },
            },
          };

          fs.writeFileSync("slsa-provenance.json", `${JSON.stringify(predicate, null, 2)}\n`);
          NODE
      - name: Keyless attest
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ${{ inputs.image }}
        run: |
          cosign attest --yes --predicate slsa-provenance.json --type slsaprovenance1 "$IMAGE"
      - name: Verify attestation
        if: ${{ inputs.verify }}
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ${{ inputs.image }}
          IDENTITY: ${{ inputs.verify-identity }}
        run: |
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
