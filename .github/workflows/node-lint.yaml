name: Node lint
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing package.json and a lockfile
        type: string
        default: .
      package-manager:
        description: pnpm, npm, yarn or bun; empty detects a single lockfile
        type: string
        default: ''
      node-version:
        description: Empty reads .node-version, .nvmrc or engines.node, then defaults to 24
        type: string
        default: ''
      pnpm-version:
        description: Empty reads the packageManager field
        type: string
        default: ''
      bun-version:
        description: Bun version; empty uses setup-bun's default
        type: string
        default: ''
      install-args:
        description: Additional whitespace-separated arguments; shell quoting is not interpreted
        type: string
        default: ''
      pnpm-minimum-release-age:
        description: Optional package age in minutes; empty preserves repository policy
        type: string
        default: ''
      pnpm-strict-dep-builds:
        description: Optional true/false override; empty preserves repository policy
        type: string
        default: ''
      check-script:
        description: Type/framework check script; empty skips
        type: string
        default: check
      format-script:
        description: Optional formatting check script; empty skips.
        type: string
        default: ''
      lint-script:
        description: Lint script; empty skips
        type: string
        default: lint
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/setup-node@8a6be24dc3b8595b2d838cdea638f9e6683fb4d0
        with:
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          bun-version: ${{ inputs.bun-version }}
          install-args: ${{ inputs.install-args }}
          pnpm-minimum-release-age: ${{ inputs.pnpm-minimum-release-age }}
          pnpm-strict-dep-builds: ${{ inputs.pnpm-strict-dep-builds }}
        id: setup
      - name: Run repository checks
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.setup.outputs.package-manager }}
          CHECK_SCRIPT: ${{ inputs.check-script }}
          FORMAT_SCRIPT: ${{ inputs.format-script }}
          LINT_SCRIPT: ${{ inputs.lint-script }}
        run: |
          if [[ -z "$FORMAT_SCRIPT" && -z "$CHECK_SCRIPT" && -z "$LINT_SCRIPT" ]]; then
            echo "At least one format, check or lint script is required" >&2
            exit 1
          fi

          if [[ -n "$FORMAT_SCRIPT" ]]; then
            "$PM" run "$FORMAT_SCRIPT"
          fi

          if [[ -n "$CHECK_SCRIPT" ]]; then
            "$PM" run "$CHECK_SCRIPT"
          fi

          if [[ -n "$LINT_SCRIPT" ]]; then
            "$PM" run "$LINT_SCRIPT"
          fi
